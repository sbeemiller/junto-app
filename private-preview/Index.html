<!doctype html>
<html><head><base target="_top"><style><?!= includeStyle_(); ?></style><style>
.preview-note{padding:12px 20px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}.private-main{max-width:1200px;margin:auto;padding:28px 20px}.private-tabs{display:flex;position:sticky;top:0;background:var(--bg);z-index:4;border-bottom:1px solid var(--line);padding:0 12px}.private-tabs button{flex:1;border:0;border-bottom:2px solid transparent;background:none;padding:16px 4px;font-size:13px;color:var(--muted)}.private-tabs button.active{border-color:var(--gold);color:var(--gold)}.private-account{font-size:11px;color:var(--muted)}.private-row{padding:18px 0;border-bottom:1px solid var(--line)}.private-row:last-child{border:0}.private-row p{white-space:pre-wrap;overflow-wrap:anywhere}.private-link{color:var(--gold);display:block;margin:8px 0;overflow-wrap:anywhere}.private-loading{padding:40px;text-align:center;color:var(--muted)}.private-actions{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.private-tabs button:disabled{opacity:.4}.private-main .grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
</style></head><body>
<header class="topbar"><span class="brand"><span class="seal">J</span> JUNTO</span><span class="private-account">Owner preview</span></header>
<div class="preview-note">Private, read-only Sheet connection. Changes are made in Google Sheets during this test.</div>
<nav class="private-tabs" aria-label="Preview sections"><button data-section="Home" class="active">Home</button><button data-section="Brothers">Brothers</button><button data-section="Meetings">Meetings</button><button data-section="Commitments">Commitments</button></nav>
<main class="private-main" id="view"><p class="private-loading" role="status">Loading your group records…</p></main>
<script>
'use strict';
let snapshot, section='Home', query='';
const escapeHTML=value=>String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeURL=value=>{try{const u=new URL(value);return u.protocol==='https:'?u.href:'';}catch{return '';}};
const records=key=>snapshot.collections[key]||[];
function links(value,label){return String(value||'').split('\n').filter(Boolean).map((url,i)=>safeURL(url)?'<a class="private-link" target="_blank" rel="noopener noreferrer" href="'+escapeHTML(safeURL(url))+'">'+escapeHTML(label)+(i?' '+(i+1):'')+' ↗</a>':'').join('');}
function heading(title,description){return '<div class="page-heading"><div><span class="eyebrow">YOUR GROUP RECORDS</span><h1>'+escapeHTML(title)+'</h1><p class="subtitle">'+escapeHTML(description)+'</p></div></div>';}
function empty(message){return '<p class="empty">'+escapeHTML(message)+'</p>';}
function meetingCard(m){return '<article class="panel"><span class="eyebrow">'+escapeHTML(m.meeting_date)+'</span><h2>'+escapeHTML(m.title)+'</h2><p class="small muted">'+escapeHTML(m.source_review||m.status)+'</p>'+(m.summary?'<h3>Summary</h3><p>'+escapeHTML(m.summary)+'</p>':'<p class="muted small">Summary not reviewed yet.</p>')+(m.themes?'<h3>Themes</h3><p>'+escapeHTML(m.themes)+'</p>':'')+(m.takeaways?'<h3>Takeaways</h3><p>'+escapeHTML(m.takeaways)+'</p>':'')+(m.carry_forward_question?'<h3>A question to carry forward</h3><p>'+escapeHTML(m.carry_forward_question)+'</p>':'')+links(m.notes_links,'Meeting notes')+links(m.recording_links,'Recording')+links(m.chat_links,'Meeting chat')+'</article>';}
function latestReflection(memberId){return records('Reflections').filter(r=>r.member_id===memberId).sort((a,b)=>dateNumber(b.reflection_date)-dateNumber(a.reflection_date)||b.updated_at.localeCompare(a.updated_at))[0];}
function dateNumber(value){const n=Date.parse(value);return Number.isFinite(n)?n:0;}
function render(){
 const view=document.getElementById('view');if(!snapshot)return;
 document.querySelectorAll('[data-section]').forEach(b=>{b.classList.toggle('active',b.dataset.section===section);b.setAttribute('aria-current',b.dataset.section===section?'page':'false');});
 let body='';
 if(section==='Home'){
  const member=records('Members').find(m=>m.role==='owner');
  const now=new Date();now.setHours(0,0,0,0);
  const upcoming=records('Meetings').filter(m=>m.status==='scheduled'&&dateNumber(m.meeting_date)>=now.getTime()).sort((a,b)=>dateNumber(a.meeting_date)-dateNumber(b.meeting_date))[0];
  const last=records('Meetings').filter(m=>dateNumber(m.meeting_date)<now.getTime()).sort((a,b)=>dateNumber(b.meeting_date)-dateNumber(a.meeting_date))[0];
  body=heading('Welcome'+(member?', '+member.display_name.split(' ')[0]:''),'Your private reference view, reading the group’s Google Sheet.')+'<div class="private-actions"><button class="btn primary" id="refresh">Refresh records</button>'+links(snapshot.sheetUrl,'Open group Sheet')+'</div><div class="grid"><section class="panel"><h2>Next gathering</h2>'+(upcoming?'<h3>'+escapeHTML(upcoming.title)+'</h3><p>'+escapeHTML(upcoming.meeting_date)+' '+escapeHTML(upcoming.scheduled_start)+'</p>':'<p class="muted">No confirmed future gathering entered yet.</p>')+'</section><section class="panel"><h2>My focus</h2><p>'+escapeHTML(member?.current_focus||'Add your focus in the Members tab of the Sheet.')+'</p></section></div><section class="panel" style="margin-top:24px"><h2>Last indexed meeting</h2>'+(last?'<p>'+escapeHTML(last.title)+' · '+escapeHTML(last.meeting_date)+'</p>'+links(last.notes_links,'Open notes'):'<p>No past meeting indexed.</p>')+'</section>';
 }
 if(section==='Brothers')body=heading('The brothers','Only confirmed member records appear here.')+'<div class="grid">'+records('Members').filter(m=>m.active.toLowerCase()==='true').map(m=>{const r=latestReflection(m.member_id);return '<article class="panel"><span class="eyebrow">'+escapeHTML(m.role)+'</span><h2>'+escapeHTML(m.display_name)+'</h2><h3>Current chapter</h3><p>'+escapeHTML(m.current_chapter||'Not added yet.')+'</p><h3>Personal focus</h3><p>'+escapeHTML(m.current_focus||'Not added yet.')+'</p><h3>How to support</h3><p>'+escapeHTML(m.how_to_support||'Not added yet.')+'</p><div class="detail-section"><h3>Latest High / Low / Buffalo</h3>'+(r?'<p class="small muted">'+escapeHTML(r.reflection_date)+'</p>'+['high','low','buffalo'].map(key=>'<p><strong>'+key[0].toUpperCase()+key.slice(1)+'</strong><br>'+escapeHTML(r[key]||'Not added.')+'</p>').join(''):'<p class="muted">No reflection yet.</p>')+'</div></article>';}).join('')+'</div>';
 if(section==='Meetings')body=heading('Meeting archive','Original notes and recording links, with reviewed summaries when available.')+'<input id="search" type="search" aria-label="Search meetings" placeholder="Search meeting titles, themes, or summaries…" value="'+escapeHTML(query)+'" style="margin-bottom:20px"><div id="results" class="grid">'+meetingResults()+'</div>';
 if(section==='Commitments')body=heading('Commitments','Read-only view of the group’s recorded promises.')+(records('Commitments').length?'<section class="panel">'+records('Commitments').map(c=>{const member=records('Members').find(m=>m.member_id===c.member_id);return '<article class="private-row"><h3>'+escapeHTML(c.title)+'</h3><p class="muted">'+escapeHTML(member?.display_name||'Member')+' · '+escapeHTML(c.status)+'</p><p>Target: '+escapeHTML(c.target)+' '+escapeHTML(c.unit)+'</p><p>'+escapeHTML(c.notes)+'</p></article>';}).join('')+'</section>':empty('No commitments recorded in the Sheet yet. Demo commitments are kept separate.'));
 view.innerHTML=body;
}
function meetingResults(){const list=records('Meetings').filter(m=>[m.title,m.themes,m.summary,m.meeting_date].join(' ').toLowerCase().includes(query.toLowerCase())).sort((a,b)=>dateNumber(b.meeting_date)-dateNumber(a.meeting_date));return list.length?list.map(meetingCard).join(''):empty('No matching meetings.');}
function load(){document.getElementById('view').innerHTML='<p class="private-loading" role="status">Loading your group records…</p>';google.script.run.withSuccessHandler(data=>{snapshot=data;render();}).withFailureHandler(()=>{document.getElementById('view').innerHTML='<section class="panel"><h2>Records could not load</h2><p>Sign in with the owner Google account and authorize the preview’s read access.</p><button class="btn" id="refresh">Try again</button></section>';}).getSnapshot();}
document.addEventListener('click',e=>{const tab=e.target.closest('[data-section]');if(tab){section=tab.dataset.section;render();window.scrollTo(0,0);}if(e.target.closest('#refresh'))load();});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;document.getElementById('results').innerHTML=meetingResults();}});
load();
</script></body></html>
